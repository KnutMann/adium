		ADD1E5C0DE00000000009901 /* Strip Custom Icon Before Signing */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			alwaysOutOfDate = 1;
			files = (
			);
			inputPaths = (
			);
			name = "Strip Custom Icon Before Signing";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# A custom icon on a folder or bundle lives in an Icon file carrying a resource fork, plus a flag\n# in the bundle's own Finder information. codesign refuses to sign a bundle holding either, so a\n# build over a bundle that has picked one up fails with\n# \"resource fork, Finder information, or similar detritus not allowed\".\n#\n# Adium used to do this to itself on every icon change; it no longer does. Setting one by hand in\n# the Finder still does, so this stays. It costs nothing when there is nothing to take off.\nAPP=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\n[ -d \"$APP\" ] || exit 0\n/usr/bin/find \"$APP\" -maxdepth 1 -name 'Icon?' -delete\n/usr/bin/xattr -c \"$APP\" 2>/dev/null || true\n";
		};
