# Cut a release: build, package, publish.
#
# Issue #9 asks for something to download instead of a repository to build, and
# this is the half that can exist today. It is not signed and not notarised,
# because both need a paid Apple membership. What that costs the person
# downloading it is one command, and the release text says so rather than leaving
# them with "Adium is damaged" and no explanation.
#
# When there is a membership, three steps go in between build and package, and
# nothing else here changes: import the Developer ID certificate, sign, then
# notarytool submit --wait and stapler staple. The packaging script is deliberately
# ignorant of all three.
#
# Triggered by a tag. Run it by hand to rehearse: it builds and packages and
# uploads the two files as a workflow artifact, and publishes nothing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and package
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out, with the submodule the build cannot start without
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Take the newest Xcode on the image
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Restore the two dependencies that are not in the repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Dependencies/webrtc/WebRTC.xcframework
            Dependencies/picomemo/picomemo
          key: deps-${{ runner.os }}-${{ hashFiles('Dependencies/webrtc/fetch-webrtc.sh', 'Dependencies/picomemo/fetch-picomemo.sh') }}

      - name: Fetch what the repository does not carry
        run: Dependencies/fetch.sh

      - name: Build and verify
        run: ./install.sh --build-only

      - name: Every shipped binary carries its licence
        run: ./Utilities/verify-licenses.sh

      - name: Name this build
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Package a zip and a disk image
        run: ./Utilities/package-release.sh build/Release/Adium.app "${{ steps.name.outputs.version }}"

      - name: Write what the release says
        run: |
          v='${{ steps.name.outputs.version }}'
          {
            echo "Apple Silicon only, macOS 13 or later."
            echo
            echo "**This build is not signed and not notarised.** Signing needs a paid Apple"
            echo "developer membership, which this fork does not have yet, so macOS will refuse"
            echo "to open it and will say the application is damaged. It is not. After moving"
            echo "Adium into your Applications folder, run this once:"
            echo
            echo '```'
            echo 'xattr -r -d com.apple.quarantine /Applications/Adium.app'
            echo '```'
            echo
            echo "Take the disk image if you are installing by hand, the zip if something else"
            echo "is unpacking it for you."
            echo
            echo "| file | sha256 |"
            echo "| --- | --- |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` |"
            done
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Adium ${{ steps.name.outputs.version }}" \
            --notes-file dist/notes.md \
            dist/*.zip dist/*.dmg

      - name: Keep the packages when this was only a rehearsal
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adium-${{ steps.name.outputs.version }}
          path: dist/
          retention-days: 7
